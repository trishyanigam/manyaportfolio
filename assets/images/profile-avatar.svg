<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="ambientCircle" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" fill="url(#bgGrad)" />
  <circle cx="200" cy="190" r="150" fill="url(#ambientCircle)" />

  <!-- Abstract Aesthetic Backdrop Rings -->
  <circle cx="200" cy="190" r="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-dasharray="6,6" />
  <circle cx="200" cy="190" r="85" fill="none" stroke="url(#accentLine)" stroke-width="2" />

  <!-- Avatar Monogram Core -->
  <circle cx="200" cy="190" r="70" fill="url(#primaryGlow)" />
  <text x="200" y="208" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-2">MN</text>

  <!-- Title Pill -->
  <rect x="75" y="300" width="250" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
  <text x="200" y="323" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle" letter-spacing="1.5">MANYA NIGAM</text>

  <!-- Subtitle -->
  <text x="200" y="360" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Digital Marketing &amp; BD</text>

  <!-- Decorative Corner Accents -->
  <circle cx="60" cy="60" r="3" fill="#6366f1" />
  <circle cx="340" cy="60" r="3" fill="#38bdf8" />
  <circle cx="60" cy="420" r="3" fill="#ec4899" />
  <circle cx="340" cy="420" r="3" fill="#6366f1" />
</svg>

